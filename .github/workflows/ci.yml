name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Pre-commit gate
    runs-on: ubuntu-latest
    env:
      CLOSURE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      CLOSURE_TRIGGER: ${{ github.event_name }}
      GITHUB_RUN_ID: ${{ github.run_id }}
      GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Run shellcheck + inventory + trailer validation
        env:
          CLOSURE_PHASE: check
          PARENT_COMMAND: make check
          CLOSURE_IDENTITY_RECEIPT_PATH: ${{ runner.temp }}/closure-identity-check.json
        run: make check

  test:
    name: Test suite
    runs-on: ubuntu-latest
    needs: check
    env:
      CLOSURE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      CLOSURE_TRIGGER: ${{ github.event_name }}
      GITHUB_RUN_ID: ${{ github.run_id }}
      GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Run all tests
        env:
          CLOSURE_PHASE: test
          PARENT_COMMAND: make test
          CLOSURE_IDENTITY_RECEIPT_PATH: ${{ runner.temp }}/closure-identity-test.json
        run: make test

  validate:
    name: Schema validation
    runs-on: ubuntu-latest
    needs: check
    env:
      CLOSURE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      CLOSURE_TRIGGER: ${{ github.event_name }}
      GITHUB_RUN_ID: ${{ github.run_id }}
      GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON schemas
        env:
          CLOSURE_PHASE: validate
          PARENT_COMMAND: make validate
          CLOSURE_IDENTITY_RECEIPT_PATH: ${{ runner.temp }}/closure-identity-validate.json
        run: make validate
