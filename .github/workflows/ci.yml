name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Pre-commit gate
    runs-on: ubuntu-latest
    env:
      CLOSURE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      CLOSURE_TRIGGER: ${{ github.event_name }}
      GITHUB_RUN_ID: ${{ github.run_id }}
      GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # Owner convergence is frozen to issue #225's exact starting main. A
      # successor owner change must deliberately re-pin this invariant.
      - name: Verify frozen owner base
        env:
          EVENT_OWNER_BASE: ${{ github.event.pull_request.base.sha || '8b98388dac1ba070d61d8abdb1d4b46c7b85fe01' }}
          EXPECTED_OWNER_BASE: 8b98388dac1ba070d61d8abdb1d4b46c7b85fe01
        run: test "$EVENT_OWNER_BASE" = "$EXPECTED_OWNER_BASE"
      - name: Check out frozen compatible core baseline
        uses: actions/checkout@v4
        with:
          repository: briancl2/repo-agent-core
          ref: 9da7b41b83a10b9fd71ad24b0529a50425a8d373
          path: .core-baseline
      - name: Run shellcheck + inventory + trailer validation
        env:
          CLOSURE_PHASE: check
          PARENT_COMMAND: make check
          CLOSURE_IDENTITY_RECEIPT_PATH: ${{ runner.temp }}/closure-identity-check.json
          CORE_REPO: ${{ github.workspace }}/.core-baseline
        run: make check

  test:
    name: Test suite
    runs-on: ubuntu-latest
    needs: check
    env:
      CLOSURE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      CLOSURE_TRIGGER: ${{ github.event_name }}
      GITHUB_RUN_ID: ${{ github.run_id }}
      GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Run all tests
        env:
          CLOSURE_PHASE: test
          PARENT_COMMAND: make test
          CLOSURE_IDENTITY_RECEIPT_PATH: ${{ runner.temp }}/closure-identity-test.json
        run: make test

  validate:
    name: Schema validation
    runs-on: ubuntu-latest
    needs: check
    env:
      CLOSURE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      CLOSURE_TRIGGER: ${{ github.event_name }}
      GITHUB_RUN_ID: ${{ github.run_id }}
      GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate JSON schemas
        env:
          CLOSURE_PHASE: validate
          PARENT_COMMAND: make validate
          CLOSURE_IDENTITY_RECEIPT_PATH: ${{ runner.temp }}/closure-identity-validate.json
        run: make validate
